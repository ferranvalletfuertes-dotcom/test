<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test de seguretat informàtica</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f8;--card:#fff;--ink:#12233a;--mute:#5b6b80;--line:#d6dfea;--acc:#1b5fd6;--accbg:#e4edfd;--ok:#12805c;--okbg:#dff4ec;--ko:#c2352f;--kobg:#fbe5e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--card:#17222f;--ink:#e6edf6;--mute:#93a3b8;--line:#2a3a4d;--acc:#6ea2ff;--accbg:#1c2f52;--ok:#4cc79a;--okbg:#12362b;--ko:#ff8a84;--kobg:#3d1b1a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{padding:28px 0 16px}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
header p{margin:0;color:var(--mute)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;margin-bottom:8px}
.bar .t{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute);margin-bottom:6px}
.track{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.fill{height:100%;width:0;background:var(--acc);transition:width .25s}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.q h2{font-size:1.05rem;margin:0 0 12px;display:flex;gap:10px}
.n{flex:none;min-width:2em;height:2em;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0 0;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.l{flex:none;width:1.7em;height:1.7em;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mute)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.sel .l{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.ko .l{background:var(--ko);border-color:var(--ko);color:#fff}
.done .opt{cursor:default}
.fb{margin:12px 0 0;font-size:.9rem;font-weight:600}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}.fb.nc{color:var(--mute)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px 24px;cursor:pointer;background:var(--acc);color:#fff}
button.b.g{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button.b:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#warn{color:var(--ko);font-weight:600;margin-top:12px;min-height:1.4em}
#res{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;margin:14px 0;text-align:center}
.grade{font-size:clamp(3.2rem,14vw,5rem);font-weight:800;line-height:1;letter-spacing:-.03em}
.grade small{font-size:.35em;color:var(--mute);font-weight:600}
.stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:14px 0;color:var(--mute)}
.stats b{display:block;font-size:1.5rem;color:var(--ink)}
#msg{font-size:1.1rem;font-weight:700;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Test de seguretat informàtica</h1>
<p>20 preguntes. Marca una resposta per pregunta; torna a tocar-la per desmarcar-la.</p>
</header>
<div class="bar"><div class="t"><span id="cnt">0 / 20 contestades</span><span id="pct">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></div>
<div id="res" aria-live="polite" tabindex="-1">
<div class="grade"><span id="g">0</span><small> / 10</small></div>
<div id="msg"></div>
<div class="stats"><div><b id="sOk">0</b>encerts</div><div><b id="sKo">0</b>errors</div><div><b id="sNc">0</b>en blanc</div></div>
<p style="color:var(--mute);margin:0">Revisa a sota les respostes correctes (en verd) i les errades (en roig).</p>
<div class="actions" style="justify-content:center"><button class="b" onclick="reset()">Tornar a fer el test</button></div>
</div>
<div id="qs"></div>
<div id="warn"></div>
<div class="actions" id="act"><button class="b" id="send" onclick="send()">Enviar respostes</button><button class="b g" onclick="reset()">Esborrar respostes</button></div>
</div>
<script>
const Q=[
["Per què cal protegir la informació en un sistema informàtic?",["Només per complir amb la normativa legal vigent","Perquè és un actiu valuós que pot patir pèrdues, robatori o modificació no autoritzada","Únicament per evitar que els usuaris facen servir programari no autoritzat","Perquè els sistemes informàtics sempre són insegurs per naturalesa"],1],
["Quins són els tres pilars clàssics de la seguretat de la informació?",["Autenticació, autorització i auditoria","Confidencialitat, integritat i disponibilitat","Prevenció, detecció i correcció","Física, lògica i activa"],1],
["La confidencialitat garanteix que:",["La informació estiga sempre disponible quan es necessite","La informació no siga modificada per persones no autoritzades","Només les persones autoritzades puguen accedir a la informació","Es puga demostrar qui ha enviat un missatge"],2],
["La integritat de la informació es refereix a:",["Que la informació siga exacta, completa i no haja estat alterada de manera no autoritzada","Que la informació estiga xifrada en tot moment","Que la informació estiga disponible 24/7","Que la informació només siga accessible des de la xarxa interna"],0],
["La disponibilitat implica que:",["La informació només estiga accessible en horari laboral","Els usuaris autoritzats puguen accedir a la informació i als recursos quan els calga","La informació estiga duplicada en tres servidors","La informació no es puga esborrar mai"],1],
["El principi de no repudi (no repudiació) significa que:",["L'usuari no pot negar haver realitzat una acció o enviat un missatge","L'usuari pot rebutjar les condicions d'ús del sistema","El sistema no pot rebutjar cap petició d'accés","Cap usuari pot ser expulsat del sistema"],0],
["Quina diferència hi ha entre seguretat física i seguretat lògica?",["La física protegeix el maquinari i les instal·lacions; la lògica protegeix les dades i el programari","La física protegeix les dades; la lògica protegeix els equips","Són sinònims i s'utilitzen indistintament","La física només s'aplica a servidors i la lògica a ordinadors personals"],0],
["La seguretat passiva es caracteritza per:",["Actuar abans de produir-se l'incident, prevenint-lo","Detectar i corregir els danys un cop produïda l'amenaça","Xifrar totes les comunicacions de la xarxa","Analitzar les vulnerabilitats del sistema periòdicament"],1],
["La seguretat activa es caracteritza per:",["Tenir com a objectiu evitar o prevenir les amenaces abans que es materialitzen","Actuar només després que s'haja produït un atac","Ser sempre més econòmica que la seguretat passiva","No requerir cap mena de manteniment"],0],
["Quins són els tres factors d'autenticació clàssics?",["Usuari, contrasenya i correu electrònic","Una cosa que saps, una cosa que tens i una cosa que tu eres","Xifrat, signatura i hash","Confidencialitat, integritat i disponibilitat"],1],
["Un exemple de factor d'autenticació biomètric seria:",["Una contrasenya","Un token USB","L'empremta dactilar o el reconeixement facial","Un certificat digital emmagatzemat al disc"],2],
["Què significa el model AAA en seguretat informàtica?",["Accés, Alerta i Auditoria","Autenticació, Autorització i Auditoria (Accounting)","Antivirus, Antispam i Antimalware","Anàlisi, Avaluació i Acció"],1],
["La comunicació \"extrem a extrem\" (i2i / end-to-end) implica que:",["Les dades viatgen xifrades entre els dos extrems i només ells les poden desxifrar","Les dades passen sense xifrar per tots els intermediaris","El servidor central desxifra sempre els missatges","Només s'aplica a xarxes locals"],0],
["Què és una vulnerabilitat?",["Un programa maliciós que ataca el sistema","Una debilitat o error en el sistema que pot ser explotat per una amenaça","Un atac que ja s'ha produït","Una eina per protegir el sistema"],1],
["Què és un exploit?",["Un tipus de contrasenya molt segura","Una tècnica, codi o eina que aprofita una vulnerabilitat per comprometre el sistema","Un mètode de xifrat de dades","Un protocol de comunicació segura"],1],
["Quin d'aquests és un tipus de malware?",["Tallafocs (firewall)","Xifrat AES","Troià (trojan)","VPN"],2],
["Un atac de \"phishing\" consisteix principalment a:",["Enviar moltes peticions per saturar un servidor","Enganyar l'usuari perquè revele informació confidencial fent-se passar per una entitat de confiança","Xifrar les dades de la víctima i demanar un rescat","Escanejar ports oberts d'una xarxa"],1],
["Quin és l'objectiu principal del Reglament General de Protecció de Dades (RGPD)?",["Regular l'ús de programari lliure a les empreses","Protegir les persones físiques pel que fa al tractament de les seves dades personals","Establir les normes tècniques dels sistemes operatius","Regular únicament les transaccions comercials electròniques"],1],
["En el context de l'Administració electrònica, què cal garantir principalment?",["Que tots els tràmits es facen presencialment","La identitat dels ciutadans i la integritat i confidencialitat de les seues dades en els tràmits telemàtics","Que els tràmits només es puguen fer amb contrasenya simple","Que no es guarde cap registre dels tràmits realitzats"],1],
["Quina afirmació sobre els tipus d'atacs és correcta?",["Els atacs passius només modifiquen la informació sense llegir-la","Els atacs actius busquen modificar, interrompre o destruir recursos, mentre que els passius solen interceptar o escoltar informació sense alterar-la","Tots els atacs són sempre actius","Els atacs passius sempre deixen traces evidents al sistema"],1]
];
const A=Array(Q.length).fill(null);let done=false;
const $=id=>document.getElementById(id);
function render(){
  $('qs').className=done?'done':'';
  $('qs').innerHTML=Q.map((q,i)=>`<section class="q" id="q${i}"><h2><span class="n">${i+1}</span><span>${q[0]}</span></h2>`+
  q[1].map((o,j)=>{
    let c='opt';
    if(done){ if(j===q[2])c+=' ok'; else if(A[i]===j)c+=' ko'; }
    else if(A[i]===j)c+=' sel';
    return `<button type="button" class="${c}" aria-pressed="${A[i]===j}" onclick="pick(${i},${j})"><span class="l">${'abcd'[j]}</span><span>${o}</span></button>`;
  }).join('')+
  (done?fb(i,q):'')+`</section>`).join('');
  const n=A.filter(x=>x!==null).length;
  $('cnt').textContent=n+' / 20 contestades';
  $('pct').textContent=Math.round(n/20*100)+'%';
  $('fill').style.width=(n/20*100)+'%';
}
function fb(i,q){
  if(A[i]===null)return `<p class="fb nc">Sense resposta. La correcta és la ${'abcd'[q[2]]}.</p>`;
  return A[i]===q[2]?`<p class="fb ok">Correcte</p>`:`<p class="fb ko">Errada. La correcta és la ${'abcd'[q[2]]}.</p>`;
}
function pick(i,j){
  if(done)return;
  A[i]=A[i]===j?null:j;
  const y=window.scrollY;render();window.scrollTo(0,y);
  $('warn').textContent='';
}
function send(){
  const blank=A.filter(x=>x===null).length;
  if(blank&&!confirm('Tens '+blank+' pregunta'+(blank>1?'es':'')+' sense contestar. Les comptarà com a en blanc. Vols enviar igualment?'))return;
  done=true;
  const ok=A.filter((a,i)=>a===Q[i][2]).length;
  const ko=A.filter((a,i)=>a!==null&&a!==Q[i][2]).length;
  const nota=(ok/Q.length*10);
  $('g').textContent=nota.toFixed(1).replace('.0','').replace('.',',');
  $('sOk').textContent=ok;$('sKo').textContent=ko;$('sNc').textContent=blank;
  $('msg').textContent=nota>=9?'Excel·lent':nota>=7?'Notable':nota>=5?'Aprovat':'Suspés: tornes-hi!';
  $('msg').style.color=nota>=5?'var(--ok)':'var(--ko)';
  $('res').style.display='block';$('act').style.display='none';
  render();$('res').scrollIntoView({behavior:'smooth',block:'start'});$('res').focus({preventScroll:true});
}
function reset(){
  A.fill(null);done=false;
  $('res').style.display='none';$('act').style.display='flex';$('warn').textContent='';
  render();window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
